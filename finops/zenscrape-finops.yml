description: >-
  FinOps view of Zenscrape spend. Zenscrape bills a fixed monthly subscription
  per tier, each bundling a pool of request credits. Cost is realized as credits
  consumed per scrape: 1 credit basic, 5 with JavaScript rendering, 10 with
  premium proxies, and 25 with premium proxies plus rendering. Optimizing spend
  means choosing the lowest-cost request configuration that still succeeds and
  right-sizing the monthly tier to actual credit burn.
notes: >-
  Per-request credit costs and tier credit allotments are subject to change;
  verify against the Zenscrape pricing page and dashboard during reconciliation.
sources:
