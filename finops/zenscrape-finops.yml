meters:
- name: basic_requests
  description: Scrape requests with no rendering and no premium proxy, billed at 1 credit each.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - endpoint
- name: render_requests
  description: Scrape requests with headless-browser JavaScript rendering, billed at 5 credits each.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - endpoint
- name: premium_requests
  description: Scrape requests routed through premium residential proxies, billed at 10 credits each.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - endpoint
- name: premium_render_requests
  description: Scrape requests with both premium proxies and rendering, billed at 25 credits each.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - endpoint
- name: subscription_fee
  description: Fixed monthly subscription charge for the active plan tier.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - plan
principles:
- name: Visibility
  description: Track credit consumption per request configuration via /status and dashboard usage exports.
- name: Allocation
  description: Tag API keys per workload/team and attribute credit burn to internal cost centers.
- name: Optimization
  description: Use basic (1-credit) requests when possible; only enable render or premium when the target requires it; right-size the monthly tier and take the 10% annual discount.
- name: Accountability
  description: Assign owners per scraping job; review monthly credit burn against the tier allotment before renewal or upgrade.
